{% load static %}<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>ورود | InstaRadar</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"><link rel="stylesheet" href="{% static 'radar/style.css' %}"></head><body class="login-page"><div class="login-card animate__animated animate__fadeInUp"><div class="brand"><span class="brand-icon"><i class="fa-brands fa-instagram"></i></span><div><strong>INSTA<span>RADAR</span></strong><small>ورود امن به پنل مدیریت</small></div></div><h1>خوش آمدید</h1><p class="muted">برای ادامه به حساب مدیر وارد شوید.</p>{% if form.errors %}<div class="notice error"><i class="fa-solid fa-circle-exclamation"></i><span>نام کاربری یا رمز عبور صحیح نیست.</span></div>{% endif %}<form method="post">{% csrf_token %}<label>نام کاربری<input name="username" required autofocus autocomplete="username"></label><label>رمز عبور<input type="password" name="password" required autocomplete="current-password"></label><button class="button primary"><i class="fa-solid fa-arrow-left-to-bracket"></i> ورود به پنل</button></form></div></body></html>
