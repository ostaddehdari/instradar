# Put these locations INSIDE the existing HTTPS server for srun.ir only.
# Exact route: /instradar/ (not /instaradar/ and not /instagramradar/).
location = /instradar { return 308 /instradar/; }
location ^~ /instradar/static/ {
    alias /opt/instradar-py/public/static/;
    expires 7d;
    add_header X-Content-Type-Options nosniff;
}
# INSTRADAR-NOVNC-20260914
# Bare URL redirects to a separate client URL to set the correct WebSocket path.
# This redirect exposes no VNC content; /client.html and every asset are gated.
location = /instradar/novnc/vnc.html {
    return 302 /instradar/novnc/client.html?autoconnect=true&resize=scale&path=instradar/novnc/websockify;
}
location = /instradar/novnc-auth/ {
    internal;
    proxy_pass http://127.0.0.1:18832;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /instradar/novnc/client.html {
    auth_request /instradar/novnc-auth/;
    proxy_pass http://127.0.0.1:6080/vnc.html;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
}
location ^~ /instradar/novnc/ {
    auth_request /instradar/novnc-auth/;
    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /instradar/ {
    proxy_pass http://127.0.0.1:18832;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 100s;
}
